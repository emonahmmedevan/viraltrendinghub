<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EarnPlay Admin</title>
<style>body{margin:0;background:#f3f4f6;font-family:system-ui,sans-serif;color:#111827}.wrap{max-width:650px;margin:30px auto;padding:16px}.card{background:white;padding:20px;border-radius:16px;border:1px solid #e5e7eb;margin-bottom:14px}label{display:block;font-size:13px;font-weight:700;margin-top:12px}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;margin-top:5px}button{background:#7c3aed;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:700;margin-top:14px;cursor:pointer}.muted{font-size:12px;color:#6b7280}.status{white-space:pre-wrap;font-size:13px}</style></head>
<body><main class="wrap"><h1>EarnPlay Admin</h1><p class="muted">শুধু Firebase admin custom claim থাকা অ্যাকাউন্ট ভিডিও প্রকাশ করতে পারবে।</p>
<section class="card"><h2>Admin sign-in</h2><label>Email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">Sign in</button><button id="signOut" style="background:#4b5563">Sign out</button><div id="authStatus" class="status"></div></section>
<section class="card"><h2>Upload and publish video</h2><label>Video title</label><input id="title" maxlength="120" placeholder="ভিডিওর নাম"><label>Description (optional)</label><input id="description" maxlength="500" placeholder="বর্ণনা"><label>Video file</label><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><button id="publish">Upload & Post to Telegram</button><div id="publishStatus" class="status"></div><p class="muted">বটকে টেলিগ্রাম চ্যানেলে Admin করতে হবে। ভিডিও ID Firestore auto-ID হবে; সিরিয়াল নম্বর শুধু display label হতে পারে।</p></section>
</main><script type="module" src="./admin.js"></script></body></html>
